<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방랑클럽 — 내 채팅방</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#0071e3;--blue2:#0077ed;--nav-h:48px}
body{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;background:#f5f5f7;color:#1d1d1f;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}

/* NAV */
.chat-nav{position:sticky;top:0;z-index:100;height:var(--nav-h);background:rgba(248,248,252,.92);backdrop-filter:saturate(200%) blur(40px);-webkit-backdrop-filter:saturate(200%) blur(40px);border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.chat-nav-logo{font-size:17px;font-weight:700;color:#1d1d1f;text-decoration:none;display:flex;align-items:center;gap:8px}
.chat-nav-right{display:flex;align-items:center;gap:12px}
.user-chip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:980px;background:rgba(0,0,0,.05);transition:background .15s}
.user-avatar{width:26px;height:26px;border-radius:50%;overflow:hidden;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700;flex-shrink:0}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-name{font-size:13px;font-weight:500;color:#1d1d1f;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.signout-btn{font-size:13px;color:var(--blue);background:none;border:none;cursor:pointer;font-family:inherit;padding:0}

/* LAYOUT */
.chat-layout{flex:1;display:flex;max-width:1020px;width:100%;margin:0 auto;padding:20px 20px 24px;gap:16px}

/* SIDEBAR */
.sidebar{width:260px;flex-shrink:0;background:#fff;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);display:flex;flex-direction:column;overflow:hidden;align-self:flex-start;position:sticky;top:68px;max-height:calc(100vh - 88px)}
.sidebar-head{padding:14px 18px;border-bottom:.5px solid rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sidebar-title{font-size:14px;font-weight:700;color:#1d1d1f}
.new-btn{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;transition:background .15s,transform .1s}
.new-btn:hover{background:var(--blue2)}
.new-btn:active{transform:scale(.9)}
.room-list{overflow-y:auto;padding:4px 0;flex:1}
.room-item{padding:11px 16px;cursor:pointer;transition:background .1s;border-left:3px solid transparent;position:relative}
.room-item:hover{background:rgba(0,0,0,.03)}
.room-item.active{background:rgba(0,113,227,.06);border-left-color:var(--blue)}
.room-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;padding-right:20px}
.room-name{font-size:13px;font-weight:600;color:#1d1d1f;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-preview{font-size:11px;color:#6e6e73;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:20px}
.room-date{font-size:10px;color:#aeaeb2;flex-shrink:0}
.unread-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex-shrink:0}
.room-empty{padding:36px 16px;text-align:center;color:#aeaeb2;font-size:13px;line-height:1.75}
.room-del{display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:transparent;color:#c7c7cc;border:none;font-size:11px;cursor:pointer;align-items:center;justify-content:center;line-height:1;transition:background .15s,color .15s;padding:0}
.room-item:hover .room-del{display:flex}
.room-del:hover{background:rgba(255,59,48,.1);color:#ff3b30}

/* MAIN */
.chat-main{flex:1;background:#fff;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);display:flex;flex-direction:column;overflow:hidden;min-height:calc(100vh - 108px)}
.chat-main-head{padding:14px 22px;border-bottom:.5px solid rgba(0,0,0,.06);flex-shrink:0;display:flex;align-items:center;gap:8px;min-height:52px}
.chat-title-wrap{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.room-title-text{font-size:15px;font-weight:600;color:#1d1d1f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title-edit-btn{background:none;border:none;cursor:pointer;color:#c7c7cc;padding:2px;display:flex;align-items:center;flex-shrink:0;transition:color .15s}
.title-edit-btn:hover{color:var(--blue)}
.title-input{font-size:15px;font-weight:600;border:none;border-bottom:1.5px solid var(--blue);outline:none;background:transparent;color:#1d1d1f;padding:0 2px;min-width:80px;max-width:300px;font-family:inherit}
.chat-badge{font-size:11px;font-weight:600;padding:2px 9px;border-radius:980px;background:rgba(0,113,227,.1);color:#0071e3;flex-shrink:0}
.chat-badge.waiting{background:rgba(255,159,10,.12);color:#c07800}
.chat-badge.closed{background:rgba(52,199,89,.12);color:#248a3d}
/* 채팅 끝내기 버튼 */
.close-chat-btn{font-size:11px;font-weight:600;padding:4px 11px;border-radius:980px;border:1.5px solid rgba(255,59,48,.35);color:#ff3b30;background:rgba(255,59,48,.06);cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;flex-shrink:0}
.close-chat-btn:hover{background:rgba(255,59,48,.12);border-color:#ff3b30}
.close-chat-btn:disabled{opacity:.4;cursor:default}
/* 종결 안내 */
.closed-notice{padding:12px 18px;background:#fff;border-top:.5px solid rgba(0,0,0,.06);text-align:center;font-size:13px;color:#aeaeb2;flex-shrink:0}
/* 시스템 메시지 */
.msg-system{text-align:center;font-size:12px;color:#aeaeb2;padding:4px 12px;background:rgba(0,0,0,.04);border-radius:12px;margin:4px auto;max-width:260px}

.chat-messages{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:12px;background:#f5f5f7}
.msg-wrap{display:flex;flex-direction:column}
.msg-wrap.mine{align-items:flex-end}
.msg-wrap.theirs{align-items:flex-start}
.msg-row{display:flex;align-items:flex-end;gap:8px;max-width:72%}
.msg-wrap.mine .msg-row{flex-direction:row-reverse}
.msg-avatar{width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700;flex-shrink:0}
.msg-avatar img{width:100%;height:100%;object-fit:cover}
.bubble{padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.55;word-break:break-word}
.msg-wrap.mine .bubble{background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg-wrap.theirs .bubble{background:#fff;color:#1d1d1f;border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.msg-time{font-size:10px;color:#aeaeb2;margin-top:4px;padding:0 4px}

.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#f5f5f7;padding:40px;text-align:center}
.chat-empty-icon{font-size:48px}
.chat-empty-title{font-size:17px;font-weight:600;color:#6e6e73}
.chat-empty-sub{font-size:14px;color:#aeaeb2;line-height:1.65;max-width:280px}
.start-btn{margin-top:6px;background:var(--blue);color:#fff;font-size:14px;font-weight:600;padding:10px 24px;border-radius:980px;border:none;cursor:pointer;font-family:inherit;transition:background .15s}
.start-btn:hover{background:var(--blue2)}

.chat-input-wrap{padding:12px 18px;background:#fff;border-top:.5px solid rgba(0,0,0,.06);display:flex;gap:10px;align-items:flex-end;flex-shrink:0}
.chat-input{flex:1;border:1.5px solid rgba(0,0,0,.1);border-radius:20px;padding:10px 16px;font-size:15px;font-family:inherit;resize:none;outline:none;max-height:120px;line-height:1.5;background:#f5f5f7;color:#1d1d1f;transition:border-color .15s,background .15s}
.chat-input:focus{border-color:var(--blue);background:#fff}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--blue);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,transform .1s}
.send-btn:hover{background:var(--blue2)}
.send-btn:active{transform:scale(.9)}
.send-btn:disabled{background:#aeaeb2;cursor:default}

/* DELETE MODAL */
.del-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:center;justify-content:center}
.del-overlay.open{display:flex}
.del-modal{background:#fff;border-radius:20px;padding:32px 28px 24px;width:300px;max-width:88vw;text-align:center;animation:modalIn .25s cubic-bezier(.34,1.56,.64,1) both}
.del-modal h3{font-size:17px;font-weight:700;color:#1d1d1f;margin-bottom:8px}
.del-modal-desc{font-size:14px;color:#6e6e73;line-height:1.65;margin-bottom:24px}
.del-modal-desc strong{color:#1d1d1f}
.del-actions{display:flex;gap:10px}
.del-cancel{flex:1;padding:12px;border-radius:13px;border:1.5px solid rgba(0,0,0,.1);background:none;font-size:15px;font-weight:500;color:#1d1d1f;cursor:pointer;font-family:inherit;transition:background .15s}
.del-cancel:hover{background:rgba(0,0,0,.04)}
.del-confirm{flex:1;padding:12px;border-radius:13px;border:none;background:#ff3b30;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s}
.del-confirm:hover{background:#e0352b}

@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}

@media(max-width:680px){
  .sidebar{display:none}
  .chat-layout{padding:0;gap:0}
  .chat-main{border-radius:0;min-height:calc(100vh - var(--nav-h))}
}
</style>
</head>
<body>

<nav class="chat-nav">
  <!-- ① 로고 클릭 → 홈 -->
  <a class="chat-nav-logo" href="/">🧭 방랑클럽</a>
  <div class="chat-nav-right">
    <div class="user-chip">
      <div class="user-avatar" id="nav-avatar"></div>
      <span class="user-name" id="nav-name"></span>
    </div>
    <button class="signout-btn" onclick="doSignOut()">로그아웃</button>
  </div>
</nav>

<div class="chat-layout">
  <!-- 사이드바 -->
  <div class="sidebar">
    <div class="sidebar-head">
      <span class="sidebar-title">내 질문들</span>
      <button class="new-btn" onclick="createRoom()" title="새 질문">+</button>
    </div>
    <div class="room-list" id="room-list">
      <div class="room-empty">질문이 없어요.<br>+ 버튼으로 시작해보세요.</div>
    </div>
  </div>

  <!-- 채팅 메인 -->
  <div class="chat-main" id="chat-main">
    <div class="chat-empty">
      <div class="chat-empty-icon">🧭</div>
      <div class="chat-empty-title">여행 고민이 있으신가요?</div>
      <div class="chat-empty-sub">새 질문을 시작하면 전문가가 직접 답변해드려요.</div>
      <button class="start-btn" onclick="createRoom()">첫 질문 시작하기</button>
    </div>
  </div>
</div>

<!-- ② 삭제 확인 모달 -->
<div class="del-overlay" id="del-overlay" onclick="overlayDelClick(event)">
  <div class="del-modal">
    <h3>채팅방 삭제</h3>
    <p class="del-modal-desc" id="del-modal-desc">이 채팅방을 삭제하시겠습니까?<br>삭제된 대화는 복구할 수 없어요.</p>
    <div class="del-actions">
      <button class="del-cancel" onclick="closeDelModal()">취소</button>
      <button class="del-confirm" id="del-confirm-btn">삭제</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, addDoc, query, where, orderBy,
         onSnapshot, doc, updateDoc, serverTimestamp, getDocs, writeBatch }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey:            "AIzaSyAi8GH9BFKRi4AZwAaCQhcEh6Fbb--69SA",
  authDomain:        "pack-all-c1794.firebaseapp.com",
  projectId:         "pack-all-c1794",
  storageBucket:     "pack-all-c1794.firebasestorage.app",
  messagingSenderId: "1033545847188",
  appId:             "1:1033545847188:web:91367da0e81c2132e2bf81"
};

const app  = initializeApp(firebaseConfig, 'banglang');
const auth = getAuth(app);
const db   = getFirestore(app);

let currentUser     = null;
let currentRoomId   = null;
let unsubRooms      = null;
let unsubMessages   = null;
let unsubRoom       = null;   // 현재 방 문서 실시간 감지
let pendingDeleteId = null;

/* ── 상태 헬퍼 ── */
function getStatus(r) {
  if (r.status) return r.status;
  return r.answered ? 'in_progress' : 'unanswered';
}
function badgeLabel(status) {
  if (status === 'closed')      return ['답변완료',  'closed'];
  if (status === 'in_progress') return ['답변 중',   ''];
  return ['답변 대기중', 'waiting'];
}

/* ── Auth guard: 미로그인 → 홈 ── */
onAuthStateChanged(auth, user => {
  if (!user) { location.href = '/'; return; }
  currentUser = user;

  const avatar = document.getElementById('nav-avatar');
  if (user.photoURL) {
    avatar.innerHTML = `<img src="${user.photoURL}" alt="">`;
  } else {
    avatar.textContent = (user.displayName || 'U')[0].toUpperCase();
  }
  document.getElementById('nav-name').textContent = user.displayName || user.email;

  listenRooms();
});

window.doSignOut = () => signOut(auth);

/* ── 채팅방 목록 (복합 인덱스 없이 클라이언트 정렬) ── */
function listenRooms() {
  if (unsubRooms) unsubRooms();
  const q = query(collection(db, 'chatRooms'), where('userId', '==', currentUser.uid));
  unsubRooms = onSnapshot(q, snap => {
    const list = document.getElementById('room-list');
    if (snap.empty) {
      list.innerHTML = '<div class="room-empty">질문이 없어요.<br>+ 버튼으로 시작해보세요.</div>';
      return;
    }
    const sorted = [...snap.docs].sort((a, b) => {
      const ta = a.data().lastMessageAt?.toMillis?.() || 0;
      const tb = b.data().lastMessageAt?.toMillis?.() || 0;
      return tb - ta;
    });
    list.innerHTML = sorted.map(d => {
      const r = d.data();
      const isActive  = d.id === currentRoomId ? ' active' : '';
      const dot       = r.userUnread ? '<div class="unread-dot"></div>' : '';
      const time      = r.lastMessageAt ? timeAgo(r.lastMessageAt.toDate()) : '';
      const preview   = r.lastMessage || '대화를 시작해보세요';
      const titleSafe = escAttr(r.title || '여행 질문');
      return `<div class="room-item${isActive}" data-room-id="${d.id}"
          onclick="openRoom('${d.id}','${titleSafe}')">
        <div class="room-row">
          <div class="room-name">${escHtml(r.title || '여행 질문')}</div>
          ${dot}
          <div class="room-date">${time}</div>
        </div>
        <div class="room-preview">${escHtml(preview)}</div>
        <button class="room-del" onclick="promptDelete(event,'${d.id}','${titleSafe}')" title="삭제">✕</button>
      </div>`;
    }).join('');
  });
}

/* ── 채팅방 열기 ── */
window.openRoom = function(roomId, title) {
  currentRoomId = roomId;
  document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.room-item[data-room-id="${roomId}"]`)?.classList.add('active');

  document.getElementById('chat-main').innerHTML = `
    <div class="chat-main-head">
      <div class="chat-title-wrap">
        <span class="room-title-text" id="room-title-text">${escHtml(title)}</span>
        <button class="title-edit-btn" onclick="startEditTitle()" title="제목 수정">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
            <path d="M11.5 2.5a1.5 1.5 0 012.121 2.121L5.5 12.743l-3 .757.757-3L11.5 2.5z"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div class="chat-badge waiting" id="room-badge">답변 대기중</div>
      <button class="close-chat-btn" id="close-chat-btn" onclick="userCloseRoom()">채팅 끝내기</button>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-wrap" id="chat-input-wrap">
      <textarea class="chat-input" id="chat-input" rows="1"
        placeholder="여행 고민을 자유롭게 적어보세요…"
        oninput="autoResize(this)" onkeydown="inputKeydown(event)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M14 8L2 2l3 6-3 6 12-6z" fill="white"/>
        </svg>
      </button>
    </div>`;

  listenMessages(roomId);
  listenCurrentRoom(roomId);
  updateDoc(doc(db, 'chatRooms', roomId), { userUnread: false }).catch(()=>{});
};

/* ── ① 제목 수정 ── */
window.startEditTitle = function() {
  const titleEl = document.getElementById('room-title-text');
  if (!titleEl) return;
  const prev = titleEl.textContent;

  const input = document.createElement('input');
  input.className = 'title-input';
  input.value     = prev;
  input.maxLength = 40;
  titleEl.replaceWith(input);
  input.focus();
  input.select();

  const save = async () => {
    const next = input.value.trim() || prev;
    const span = document.createElement('span');
    span.className = 'room-title-text';
    span.id        = 'room-title-text';
    span.textContent = next;
    input.replaceWith(span);
    if (next !== prev && currentRoomId) {
      await updateDoc(doc(db, 'chatRooms', currentRoomId), { title: next });
    }
  };

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter')  { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.value = prev;  input.blur(); }
  });
  input.addEventListener('blur', save, { once: true });
};

/* ── 현재 방 실시간 감지 (상태 변경 → UI 즉시 반영) ── */
function listenCurrentRoom(roomId) {
  if (unsubRoom) unsubRoom();
  unsubRoom = onSnapshot(doc(db, 'chatRooms', roomId), snap => {
    if (!snap.exists()) return;
    const room   = snap.data();
    const status = getStatus(room);
    const [label, cls] = badgeLabel(status);

    // 배지 업데이트
    const badge = document.getElementById('room-badge');
    if (badge) { badge.textContent = label; badge.className = 'chat-badge' + (cls ? ' '+cls : ''); }

    // 종결 버튼 상태
    const closeBtn = document.getElementById('close-chat-btn');
    if (closeBtn) { closeBtn.disabled = status === 'closed'; closeBtn.textContent = status === 'closed' ? '종결됨' : '채팅 끝내기'; }

    // 입력창 ↔ 종결 안내
    const inputWrap = document.getElementById('chat-input-wrap');
    const notice    = document.getElementById('closed-notice');
    if (status === 'closed') {
      if (inputWrap && !notice) {
        inputWrap.style.display = 'none';
        const div = document.createElement('div');
        div.id = 'closed-notice';
        div.className = 'closed-notice';
        div.textContent = '🔒 종결된 채팅방입니다. 새 질문은 + 버튼을 눌러주세요.';
        inputWrap.insertAdjacentElement('afterend', div);
      }
    } else {
      if (inputWrap) inputWrap.style.display = '';
      if (notice) notice.remove();
    }
  });
}

/* ── 사용자 채팅 종결 ── */
window.userCloseRoom = async function() {
  if (!currentRoomId) return;
  if (!confirm('이 채팅방을 종결하시겠습니까?\n종결 후에는 메시지를 보낼 수 없어요.')) return;
  try {
    await addDoc(collection(db, 'chatRooms', currentRoomId, 'messages'), {
      text:       '사용자가 채팅을 종결했습니다.',
      senderType: 'system',
      createdAt:  serverTimestamp(),
    });
    await updateDoc(doc(db, 'chatRooms', currentRoomId), {
      status:        'closed',
      answered:      true,
      lastMessageAt: serverTimestamp(),
      closedAt:      serverTimestamp(),
      closedBy:      'user',
    });
  } catch(e) {
    alert('오류: ' + e.message);
  }
};

/* ── ② 삭제 모달 ── */
window.promptDelete = function(e, roomId, title) {
  e.stopPropagation();
  pendingDeleteId = roomId;
  document.getElementById('del-modal-desc').innerHTML =
    `<strong>${escHtml(title)}</strong> 채팅방을 삭제하시겠습니까?<br>삭제된 대화는 복구할 수 없어요.`;
  document.getElementById('del-confirm-btn').onclick = doDelete;
  document.getElementById('del-overlay').classList.add('open');
};

window.closeDelModal = function() {
  document.getElementById('del-overlay').classList.remove('open');
  pendingDeleteId = null;
};

window.overlayDelClick = function(e) {
  if (e.target === document.getElementById('del-overlay')) closeDelModal();
};

async function doDelete() {
  if (!pendingDeleteId) return;
  const roomId = pendingDeleteId;
  closeDelModal();
  try {
    const msgsSnap = await getDocs(collection(db, 'chatRooms', roomId, 'messages'));
    const batch = writeBatch(db);
    msgsSnap.forEach(d => batch.delete(d.ref));
    batch.delete(doc(db, 'chatRooms', roomId));
    await batch.commit();

    if (currentRoomId === roomId) {
      currentRoomId = null;
      if (unsubMessages) { unsubMessages(); unsubMessages = null; }
      if (unsubRoom)     { unsubRoom();     unsubRoom     = null; }
      document.getElementById('chat-main').innerHTML = `
        <div class="chat-empty">
          <div class="chat-empty-icon">🧭</div>
          <div class="chat-empty-title">여행 고민이 있으신가요?</div>
          <div class="chat-empty-sub">새 질문을 시작하면 전문가가 직접 답변해드려요.</div>
          <button class="start-btn" onclick="createRoom()">첫 질문 시작하기</button>
        </div>`;
    }
  } catch(err) {
    alert('삭제 오류: ' + err.message);
  }
}

/* ── 메시지 실시간 ── */
function listenMessages(roomId) {
  if (unsubMessages) unsubMessages();
  const q = query(
    collection(db, 'chatRooms', roomId, 'messages'),
    orderBy('createdAt', 'asc')
  );
  unsubMessages = onSnapshot(q, snap => {
    const box = document.getElementById('chat-messages');
    if (!box) return;

    const hasAdmin = snap.docs.some(d => d.data().senderType === 'admin');
    const badge = document.getElementById('room-badge');
    if (badge) {
      badge.textContent = hasAdmin ? '답변 완료' : '답변 대기중';
      badge.className   = 'chat-badge' + (hasAdmin ? '' : ' waiting');
    }

    const welcome = `<div class="msg-wrap theirs">
      <div class="msg-row">
        <div class="msg-avatar" style="background:#1d1d1f;font-size:13px">🧭</div>
        <div class="bubble">안녕하세요! 방랑클럽입니다 😊<br>어떤 여행 고민이든 편하게 말씀해주세요.<br>최대한 빠르게 답변 드릴게요.</div>
      </div>
    </div>`;

    const msgs = snap.docs.map(d => {
      const m    = d.data();
      if (m.senderType === 'system') {
        return `<div class="msg-system">${escHtml(m.text)}</div>`;
      }
      const mine = m.senderId === currentUser.uid;
      const side = mine ? 'mine' : 'theirs';
      const time = m.createdAt ? formatTime(m.createdAt.toDate()) : '';
      const av   = mine
        ? (currentUser.photoURL
            ? `<div class="msg-avatar"><img src="${currentUser.photoURL}" alt=""></div>`
            : `<div class="msg-avatar">${(currentUser.displayName||'U')[0]}</div>`)
        : `<div class="msg-avatar" style="background:#1d1d1f;font-size:13px">🧭</div>`;
      return `<div class="msg-wrap ${side}">
        <div class="msg-row">${av}<div class="bubble">${escHtml(m.text).replace(/\n/g,'<br>')}</div></div>
        <div class="msg-time">${time}</div>
      </div>`;
    }).join('');

    box.innerHTML = welcome + msgs;
    box.scrollTop = box.scrollHeight;
  });
}

/* ── 새 채팅방 생성 ── */
window.createRoom = async function() {
  const roomRef = await addDoc(collection(db, 'chatRooms'), {
    userId:        currentUser.uid,
    userEmail:     currentUser.email,
    userName:      currentUser.displayName || '',
    userPhotoURL:  currentUser.photoURL   || '',
    title:         '여행 질문',
    lastMessage:   '',
    lastMessageAt: serverTimestamp(),
    createdAt:     serverTimestamp(),
    status:        'unanswered',
    answered:      false,
    userUnread:    false,
  });
  openRoom(roomRef.id, '여행 질문');
};

/* ── 메시지 전송 ── */
window.sendMessage = async function() {
  const input = document.getElementById('chat-input');
  const text  = (input?.value || '').trim();
  if (!text || !currentRoomId || !currentUser) return;

  input.value = '';
  input.style.height = '';
  document.getElementById('send-btn').disabled = true;

  await addDoc(collection(db, 'chatRooms', currentRoomId, 'messages'), {
    text,
    senderId:    currentUser.uid,
    senderType:  'user',
    senderName:  currentUser.displayName || '',
    senderPhoto: currentUser.photoURL    || '',
    createdAt:   serverTimestamp(),
  });

  const msgsSnap = await getDocs(collection(db, 'chatRooms', currentRoomId, 'messages'));
  const autoTitle = text.slice(0, 30) + (text.length > 30 ? '…' : '');
  const isFirst   = msgsSnap.size <= 1;

  await updateDoc(doc(db, 'chatRooms', currentRoomId), {
    lastMessage:   text,
    lastMessageAt: serverTimestamp(),
    answered:      false,
    ...(isFirst ? { title: autoTitle } : {}),
  });

  // 헤더 제목 즉시 반영 (첫 메시지일 때)
  if (isFirst) {
    const titleEl = document.getElementById('room-title-text');
    if (titleEl) titleEl.textContent = autoTitle;
  }

  document.getElementById('send-btn').disabled = false;
};

/* ── 유틸 ── */
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}
function formatTime(d) {
  return d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
}
function timeAgo(d) {
  const s = (Date.now() - d) / 1000;
  if (s < 60)    return '방금';
  if (s < 3600)  return Math.floor(s/60)   + '분 전';
  if (s < 86400) return Math.floor(s/3600) + '시간 전';
  return Math.floor(s/86400) + '일 전';
}
window.autoResize = el => {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
};
window.inputKeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
};
</script>
