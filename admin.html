<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방랑클럽 어드민</title>
<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#0071e3;--blue2:#0077ed;
  --green:#34c759;--orange:#ff9500;--red:#ff3b30;
  --ink:#1d1d1f;--ink2:#48484a;--ink3:#6e6e73;
  --border:rgba(0,0,0,.08);--bg:#f2f2f7;
  --nav-h:52px;
}
body{font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* NAV */
nav{height:var(--nav-h);background:rgba(255,255,255,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;z-index:100}
.nav-logo{font-size:16px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.admin-badge{font-size:10px;font-weight:700;background:#ff3b30;color:#fff;padding:2px 7px;border-radius:980px;letter-spacing:.04em}
.nav-right{display:flex;align-items:center;gap:12px}
.admin-info{font-size:12px;color:var(--ink3)}
.signout{font-size:13px;color:var(--blue);background:none;border:none;cursor:pointer;font-family:inherit}

/* LAYOUT */
.layout{flex:1;display:flex;overflow:hidden}

/* SIDEBAR */
.sidebar{width:320px;flex-shrink:0;background:#fff;border-right:.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-head{padding:16px 20px;border-bottom:.5px solid var(--border);flex-shrink:0}
.sidebar-title{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:2px}
.sidebar-sub{font-size:12px;color:var(--ink3)}
.filter-tabs{display:flex;gap:4px;padding:12px 16px;border-bottom:.5px solid var(--border);flex-shrink:0}
.filter-tab{font-size:12px;font-weight:600;padding:5px 12px;border-radius:980px;border:none;cursor:pointer;font-family:inherit;transition:all .15s;background:rgba(0,0,0,.05);color:var(--ink3)}
.filter-tab.active{background:var(--blue);color:#fff}
.room-list{flex:1;overflow-y:auto}
.room-item{padding:14px 20px;cursor:pointer;border-left:3px solid transparent;transition:background .1s;border-bottom:.5px solid rgba(0,0,0,.04)}
.room-item:hover{background:rgba(0,0,0,.02)}
.room-item.active{background:rgba(0,113,227,.06);border-left-color:var(--blue)}
.room-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:8px}
.room-user{font-size:14px;font-weight:600;color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-time{font-size:11px;color:var(--ink3);flex-shrink:0}
.room-preview{font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:5px}
.room-footer{display:flex;align-items:center;gap:6px}
.badge-unanswered{font-size:10px;font-weight:700;background:rgba(255,149,0,.15);color:#c07800;padding:2px 7px;border-radius:980px}
.badge-answered{font-size:10px;font-weight:600;background:rgba(52,199,89,.12);color:#248a3d;padding:2px 7px;border-radius:980px}
.badge-new{font-size:10px;font-weight:700;background:var(--blue);color:#fff;padding:2px 7px;border-radius:980px}
.room-email{font-size:11px;color:var(--ink3)}
.room-empty{padding:48px 20px;text-align:center;color:var(--ink3);font-size:14px;line-height:1.7}

/* MAIN */
.chat-main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.no-room{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink3);background:var(--bg)}
.no-room-icon{font-size:48px}
.no-room-text{font-size:16px;font-weight:600}
.no-room-sub{font-size:13px;color:var(--ink3)}

/* CHAT HEADER */
.chat-head{padding:16px 24px;border-bottom:.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:#fff}
.chat-head-left{display:flex;align-items:center;gap:10px}
.chat-user-avatar{width:36px;height:36px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:700;flex-shrink:0;overflow:hidden}
.chat-user-avatar img{width:100%;height:100%;object-fit:cover}
.chat-user-name{font-size:15px;font-weight:600;color:var(--ink)}
.chat-user-email{font-size:12px;color:var(--ink3);margin-top:1px}
.chat-status{display:flex;align-items:center;gap:8px}

/* MESSAGES */
.chat-messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.msg-wrap{display:flex;flex-direction:column}
.msg-wrap.mine{align-items:flex-end}
.msg-wrap.theirs{align-items:flex-start}
.msg-row{display:flex;align-items:flex-end;gap:8px;max-width:68%}
.msg-wrap.mine .msg-row{flex-direction:row-reverse}
.av{width:32px;height:32px;border-radius:50%;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.bubble{padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.6;word-break:break-word;white-space:pre-wrap}
.msg-wrap.mine .bubble{background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg-wrap.theirs .bubble{background:#fff;color:var(--ink);border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.msg-time{font-size:10px;color:var(--ink3);margin-top:4px;padding:0 4px}
.msg-date-divider{text-align:center;font-size:11px;color:var(--ink3);padding:8px 0;flex-shrink:0}

/* INPUT */
.reply-wrap{padding:16px 24px;background:#fff;border-top:.5px solid var(--border);display:flex;gap:10px;align-items:flex-end;flex-shrink:0}
.reply-input{flex:1;border:1.5px solid var(--border);border-radius:16px;padding:10px 16px;font-size:14px;font-family:inherit;resize:none;outline:none;max-height:160px;line-height:1.55;background:var(--bg);color:var(--ink);transition:border-color .15s}
.reply-input:focus{border-color:var(--blue);background:#fff}
.reply-btn{background:var(--blue);color:#fff;border:none;border-radius:12px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .15s,opacity .15s;display:flex;align-items:center;gap:6px}
.reply-btn:hover{background:var(--blue2)}
.reply-btn:disabled{opacity:.45;cursor:default}
.email-info{font-size:11px;color:var(--ink3);padding:0 24px 10px;background:#fff}

/* LOGIN */
#login-view{flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.login-card{background:#fff;border-radius:20px;padding:48px 40px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08);width:360px}
.login-card h2{font-size:22px;font-weight:700;margin-bottom:8px}
.login-card p{font-size:14px;color:var(--ink3);margin-bottom:28px;line-height:1.6}
.google-btn{width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 0 0 1.5px rgba(0,0,0,.12);transition:box-shadow .15s}
.google-btn:hover{box-shadow:0 0 0 1.5px rgba(0,0,0,.25)}

/* Toast */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:#1d1d1f;color:#fff;font-size:13px;padding:10px 20px;border-radius:980px;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-logo">
    🧭 방랑클럽
    <span class="admin-badge">ADMIN</span>
  </div>
  <div class="nav-right">
    <span class="admin-info" id="admin-info"></span>
    <button class="signout" onclick="doSignOut()">로그아웃</button>
  </div>
</nav>

<!-- LOGIN VIEW -->
<div id="login-view" style="display:none">
  <div class="login-card">
    <div style="font-size:40px;margin-bottom:16px">🔐</div>
    <h2>관리자 로그인</h2>
    <p>방랑클럽 관리자 계정으로<br>로그인해주세요.</p>
    <button class="google-btn" onclick="loginGoogle()">
      <svg viewBox="0 0 18 18" width="18" height="18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
      Google로 로그인
    </button>
  </div>
</div>

<!-- ADMIN VIEW -->
<div id="admin-view" class="layout" style="display:none">

  <!-- 사이드바 -->
  <div class="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-title">채팅 목록</div>
      <div class="sidebar-sub" id="room-count">불러오는 중...</div>
    </div>
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="setFilter('all',this)">전체</button>
      <button class="filter-tab" onclick="setFilter('unanswered',this)">미답변</button>
      <button class="filter-tab" onclick="setFilter('answered',this)">답변완료</button>
    </div>
    <div class="room-list" id="room-list">
      <div class="room-empty">불러오는 중...</div>
    </div>
  </div>

  <!-- 채팅 메인 -->
  <div class="chat-main" id="chat-main">
    <div class="no-room" id="no-room">
      <div class="no-room-icon">💬</div>
      <div class="no-room-text">채팅방을 선택해주세요</div>
      <div class="no-room-sub">왼쪽 목록에서 답변할 채팅을 클릭하세요</div>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp }      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut }
                               from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, query, orderBy, onSnapshot,
         doc, addDoc, updateDoc, serverTimestamp, getDoc }
                               from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ── 설정 ── */
const ADMIN_EMAIL = 'a912243@gmail.com';

// EmailJS 설정 (https://emailjs.com 에서 발급)
const EJS_PUBLIC_KEY  = 'YOUR_EMAILJS_PUBLIC_KEY';   // TODO
const EJS_SERVICE_ID  = 'YOUR_EMAILJS_SERVICE_ID';   // TODO
const EJS_TEMPLATE_ID = 'YOUR_EMAILJS_TEMPLATE_ID';  // TODO

const firebaseConfig = {
  apiKey:            "AIzaSyAi8GH9BFKRi4AZwAaCQhcEh6Fbb--69SA",
  authDomain:        "pack-all-c1794.firebaseapp.com",
  projectId:         "pack-all-c1794",
  storageBucket:     "pack-all-c1794.firebasestorage.app",
  messagingSenderId: "1033545847188",
  appId:             "1:1033545847188:web:91367da0e81c2132e2bf81"
};

const app  = initializeApp(firebaseConfig, 'banglang-admin');
const auth = getAuth(app);
const db   = getFirestore(app);

/* ── 상태 ── */
let currentAdmin    = null;
let allRooms        = [];
let currentFilter   = 'all';
let currentRoomId   = null;
let unsubMessages   = null;
let unsubRooms      = null;

/* ── Auth ── */
onAuthStateChanged(auth, user => {
  if (!user) {
    showLogin();
    return;
  }
  if (user.email !== ADMIN_EMAIL) {
    alert('관리자 계정이 아닙니다.');
    signOut(auth);
    return;
  }
  currentAdmin = user;
  document.getElementById('admin-info').textContent = user.email;
  showAdmin();
  listenRooms();
  if (EJS_PUBLIC_KEY !== 'YOUR_EMAILJS_PUBLIC_KEY') {
    emailjs.init(EJS_PUBLIC_KEY);
  }
});

function showLogin() {
  document.getElementById('login-view').style.display  = 'flex';
  document.getElementById('admin-view').style.display  = 'none';
}
function showAdmin() {
  document.getElementById('login-view').style.display  = 'none';
  document.getElementById('admin-view').style.display  = 'flex';
}

/* ── 채팅방 목록 실시간 ── */
function listenRooms() {
  if (unsubRooms) unsubRooms();
  const q = query(collection(db, 'chatRooms'), orderBy('lastMessageAt', 'desc'));
  unsubRooms = onSnapshot(q, snap => {
    allRooms = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderRooms();
  });
}

window.setFilter = function(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderRooms();
};

function renderRooms() {
  let rooms = allRooms;
  if (currentFilter === 'unanswered') rooms = allRooms.filter(r => !r.answered);
  if (currentFilter === 'answered')   rooms = allRooms.filter(r => r.answered);

  // 미답변 먼저
  rooms = [...rooms].sort((a, b) => {
    if (!a.answered && b.answered) return -1;
    if (a.answered && !b.answered) return 1;
    const ta = a.lastMessageAt?.toDate?.() || 0;
    const tb = b.lastMessageAt?.toDate?.() || 0;
    return tb - ta;
  });

  const total      = allRooms.length;
  const unanswered = allRooms.filter(r => !r.answered).length;
  document.getElementById('room-count').textContent =
    `전체 ${total}건 · 미답변 ${unanswered}건`;

  const list = document.getElementById('room-list');
  if (!rooms.length) {
    list.innerHTML = '<div class="room-empty">해당하는 채팅이 없어요</div>';
    return;
  }

  list.innerHTML = rooms.map(r => {
    const isActive = r.id === currentRoomId ? ' active' : '';
    const time     = r.lastMessageAt ? timeAgo(r.lastMessageAt.toDate()) : '';
    const badge    = r.answered
      ? `<span class="badge-answered">답변완료</span>`
      : `<span class="badge-unanswered">미답변</span>`;
    const newBadge = r.userUnread ? '' : '';  // 사용자 미확인 여부
    const avatar   = r.userPhotoURL
      ? `<img src="${escHtml(r.userPhotoURL)}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0">`
      : `<div style="width:32px;height:32px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700;flex-shrink:0">${escHtml((r.userName||'?')[0])}</div>`;
    return `<div class="room-item${isActive}" onclick="openRoom('${r.id}')">
      <div class="room-top">
        <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
          ${avatar}
          <div style="min-width:0">
            <div class="room-user">${escHtml(r.userName || '이름없음')}</div>
            <div class="room-email">${escHtml(r.userEmail || '')}</div>
          </div>
        </div>
        <div class="room-time">${time}</div>
      </div>
      <div class="room-preview">${escHtml(r.lastMessage || '대화 없음')}</div>
      <div class="room-footer">${badge}</div>
    </div>`;
  }).join('');
}

/* ── 채팅방 열기 ── */
window.openRoom = function(roomId) {
  currentRoomId = roomId;
  renderRooms(); // active 표시 업데이트

  const room = allRooms.find(r => r.id === roomId);
  if (!room) return;

  const main = document.getElementById('chat-main');
  const avatarHtml = room.userPhotoURL
    ? `<img src="${escHtml(room.userPhotoURL)}">`
    : `<div class="chat-user-avatar">${escHtml((room.userName||'?')[0])}</div>`;

  main.innerHTML = `
    <div class="chat-head">
      <div class="chat-head-left">
        <div class="chat-user-avatar">${room.userPhotoURL ? `<img src="${escHtml(room.userPhotoURL)}">` : escHtml((room.userName||'?')[0])}</div>
        <div>
          <div class="chat-user-name">${escHtml(room.userName || '이름없음')}</div>
          <div class="chat-user-email">${escHtml(room.userEmail || '')}</div>
        </div>
      </div>
      <div class="chat-status">
        <span id="room-status-badge" class="${room.answered ? 'badge-answered' : 'badge-unanswered'}">
          ${room.answered ? '답변완료' : '미답변'}
        </span>
      </div>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="email-info" id="email-info">
      ✉️ 답변 시 <strong>${escHtml(room.userEmail||'')}</strong> 으로 이메일이 발송됩니다
    </div>
    <div class="reply-wrap">
      <textarea class="reply-input" id="reply-input" rows="2"
        placeholder="답변을 입력하세요… (Shift+Enter: 줄바꿈)"
        oninput="autoResize(this)" onkeydown="replyKeydown(event)"></textarea>
      <button class="reply-btn" id="reply-btn" onclick="sendReply()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M14 8L2 2l3 6-3 6 12-6z" fill="white"/></svg>
        답변 보내기
      </button>
    </div>`;

  listenMessages(roomId);
};

/* ── 메시지 실시간 ── */
function listenMessages(roomId) {
  if (unsubMessages) unsubMessages();
  const q = query(
    collection(db, 'chatRooms', roomId, 'messages'),
    orderBy('createdAt', 'asc')
  );
  unsubMessages = onSnapshot(q, snap => {
    const box = document.getElementById('chat-messages');
    if (!box) return;

    const room = allRooms.find(r => r.id === roomId);

    // 웰컴 메시지
    const welcome = `<div class="msg-wrap mine">
      <div class="msg-row">
        <div class="av" style="background:#1d1d1f;font-size:14px">🧭</div>
        <div class="bubble">안녕하세요! 방랑클럽입니다 😊<br>어떤 여행 고민이든 편하게 말씀해주세요.<br>최대한 빠르게 답변 드릴게요.</div>
      </div>
    </div>`;

    let lastDate = '';
    const msgs = snap.docs.map(d => {
      const m       = d.data();
      const isAdmin = m.senderType === 'admin';
      const side    = isAdmin ? 'mine' : 'theirs';
      const time    = m.createdAt ? formatTime(m.createdAt.toDate()) : '';
      const dateStr = m.createdAt ? formatDate(m.createdAt.toDate()) : '';
      let divider   = '';
      if (dateStr && dateStr !== lastDate) {
        divider   = `<div class="msg-date-divider">${dateStr}</div>`;
        lastDate  = dateStr;
      }
      const av = isAdmin
        ? `<div class="av" style="background:#1d1d1f;font-size:14px">🧭</div>`
        : (room?.userPhotoURL
          ? `<div class="av" style="overflow:hidden"><img src="${escHtml(room.userPhotoURL)}" style="width:32px;height:32px;object-fit:cover"></div>`
          : `<div class="av" style="background:var(--blue)">${escHtml((room?.userName||'?')[0])}</div>`);
      return `${divider}<div class="msg-wrap ${side}">
        <div class="msg-row">${av}<div class="bubble">${escHtml(m.text).replace(/\n/g,'<br>')}</div></div>
        <div class="msg-time">${isAdmin ? '🧭 방랑클럽 · ' : ''}${time}</div>
      </div>`;
    }).join('');

    box.innerHTML = welcome + msgs;
    box.scrollTop = box.scrollHeight;

    // 배지 업데이트
    const hasAdmin  = snap.docs.some(d => d.data().senderType === 'admin');
    const badge     = document.getElementById('room-status-badge');
    if (badge) {
      badge.textContent = hasAdmin ? '답변완료' : '미답변';
      badge.className   = hasAdmin ? 'badge-answered' : 'badge-unanswered';
    }
  });
}

/* ── 답변 전송 ── */
window.sendReply = async function() {
  const input = document.getElementById('reply-input');
  const text  = (input?.value || '').trim();
  if (!text || !currentRoomId) return;

  const btn = document.getElementById('reply-btn');
  btn.disabled = true;
  btn.textContent = '전송 중...';

  const room = allRooms.find(r => r.id === currentRoomId);

  try {
    // ① Firestore에 메시지 저장
    await addDoc(collection(db, 'chatRooms', currentRoomId, 'messages'), {
      text,
      senderId:    'admin',
      senderType:  'admin',
      senderName:  '방랑클럽',
      createdAt:   serverTimestamp(),
    });

    // ② 채팅방 상태 업데이트
    await updateDoc(doc(db, 'chatRooms', currentRoomId), {
      lastMessage:   text,
      lastMessageAt: serverTimestamp(),
      answered:      true,
      userUnread:    true,
    });

    input.value = '';
    input.style.height = '';

    // ③ 이메일 알림 발송
    if (EJS_PUBLIC_KEY !== 'YOUR_EMAILJS_PUBLIC_KEY' && room?.userEmail) {
      await emailjs.send(EJS_SERVICE_ID, EJS_TEMPLATE_ID, {
        to_email:   room.userEmail,
        to_name:    room.userName || '고객',
        reply_text: text,
        site_link:  'https://banglang-club.vercel.app/',
      });
      showToast('✅ 답변 전송 + 이메일 발송 완료');
    } else {
      showToast('✅ 답변이 전송됐습니다 (이메일 미설정)');
    }
  } catch(e) {
    showToast('❌ 오류: ' + e.message);
  }

  btn.disabled = false;
  btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M14 8L2 2l3 6-3 6 12-6z" fill="white"/></svg> 답변 보내기`;
};

window.replyKeydown = function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); }
};

/* ── Google 로그인 ── */
window.loginGoogle = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e) { if (e.code !== 'auth/popup-closed-by-user') alert(e.message); }
};
window.doSignOut = () => signOut(auth);

/* ── 유틸 ── */
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatTime(d) {
  return d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
}
function formatDate(d) {
  return d.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});
}
function timeAgo(d) {
  const s = (Date.now()-d)/1000;
  if (s<60)    return '방금';
  if (s<3600)  return Math.floor(s/60)+'분 전';
  if (s<86400) return Math.floor(s/3600)+'시간 전';
  return Math.floor(s/86400)+'일 전';
}
window.autoResize = el => {
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,160)+'px';
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
